[project]
name = "transcritor-eval"
version = "0.1.0"
description = "Evaluation harness for Transcritor Musical"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transcritor-core",
    "music21>=10.5",
    "mir_eval>=0.8",
    "soundfile",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcritor_eval"]

[tool.uv.sources]
transcritor-core = { workspace = true }

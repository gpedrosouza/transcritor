[project]
name = "transcritor-core"
version = "0.1.0"
description = "Score IR and shared contracts for Transcritor Musical"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcritor_core"]

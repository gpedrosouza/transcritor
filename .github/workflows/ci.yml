name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_licenses.py
      - run: uv run transcritor-eval run --manifest packages/eval/datasets/ci/manifest.json --subset ci --pipeline null --out eval-out
      - run: uv run transcritor-eval gate --report eval-out/report.json --baseline packages/eval/baselines/ci.json
